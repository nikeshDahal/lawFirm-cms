name: Deploy to Ubuntu via SSH

on:
  push:
    branches:
      - dev

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    env:
      VITE_APP_VERSION: ${{ secrets.VITE_APP_VERSION }}
      GENERATE_SOURCEMAP: ${{ secrets.GENERATE_SOURCEMAP }}
      VITE_APP_GRAPHQL_URL: ${{ secrets.VITE_APP_GRAPHQL_URL }}
      VITE_APP_PERSIST_KEY: ${{ secrets.VITE_APP_PERSIST_KEY }}
      VITE_APP_TINY_MCE: ${{ secrets.VITE_APP_TINY_MCE }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "18"

      - name: Install dependencies
        run: npm install --force

      - name: Build project
        run: npm run build

      - name: Rename dist folder
        run: mv ./dist ./cms.toplegaladvisers.com

      - name: Deploy to Ubuntu server via SSH
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: 22
          source: "cms.toplegaladvisers.com/*"
          target: "/var/www/html/"
